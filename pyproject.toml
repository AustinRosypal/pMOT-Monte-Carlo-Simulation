[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmot-simulation"
version = "0.1.0"
description = "Notebook-first pMOT simulation toolkit for beam geometry, fields, and atomic data."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "AJ Rosy" }
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
